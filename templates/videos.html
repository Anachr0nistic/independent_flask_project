<!DOCTYPE html>
<html>

    <head>
        <title>howdydoo</title>
        <link rel="stylesheet"
            href="{{ url_for('static',filename='styles.css') }}">
        <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>

        <meta content="width=device-width, initial-scale=1.0">

    </head>

    <body>
        <div class="maincontainer">
            <div class="topbar">
                <div
                    style="margin-left: 20px; display: flex; flex-direction: row; min-width: 200px; justify-content: space-between; color: rgb(237, 233, 230); font-size: 20px;">
                    <p class="selected">Hjem</p>
                    <p><a href="/account" class="hover">Konto</a></p>
                    <p><a href="/misc" class="hover">Andet</a></p>
                </div>
                <div style="align-content: center; margin-right: 10px;">
                    <form action="{{ url_for('index')}}" method="post">
                        <div>
                            <input
                                style="border-radius: 10px; text-align: center; max-width: 125px;"
                                name="place"
                                placeholder="Søg" autocomplete="off">
                            <button type="submit"><img
                                    src="/static/search_icon.png"
                                    height="18px"></button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="content">
                <div class="sidebar">
                    <a href="/videos" class="selected">Se Videoer</a>
                    <a href="/upload" class="hover">Upload Video</a>
                </div>
                <div id="main-container" class="mainwindow"
                    style="margin-left: 15px; color: rgb(237, 233, 230);">
                    <div class="sub">
                        <h2>Dine Videoer</h2>
                        <div class="video-grid">
                            {% for video in videos %}
                            <div
                                style="padding: 5px; border: 1px solid black; border-radius: 8px; background: rgb(92, 79, 74);">
                                <video width="313px" controls>
                                    <source
                                        src="{{ url_for('static', filename='uploads/' + video) }}"
                                        type="video/mp4">
                                </video>
                                <p style="margin-top: 8px; font-size: 14px; color: rgb(237, 233, 230);;">{{video }}</p>
                            </div>
                            {% else %}
                            <p>Ingen videoer fundet.</p>
                            {% endfor %}
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </body>

</html>
