<!DOCTYPE html>
<html>

<head>
    <title>Sign-in page</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h1 style="text-align:center; color:rgb(237, 233, 230);font-size: 60px;">Sign-in page</h1>
    <div class="logincontainer">
        <div class="logincontent">
            <div class="loginitems">
            </div>
            <div class="loginitems">
                <form action=" {{ url_for("login")}}" method="post">
                <input name="username" placeholder="Enter username" style="border-radius: 8px; text-align: center;font-size: 20px;""></input>
                    </div>
                <div class=" loginitems">
                    <input name="password" placeholder="Enter password" type="password"
                        style="border-radius: 8px; text-align: center;font-size: 20px"></input>
                </div> <br>
                <div class="loginitems" style="display: flex; justify-content: center;">
                    <button type="submit" style="font-size: 20px; min-width: 100%; border-radius: 12px;">LOGIN</button>
                    </form>
                </div>
                <div class="loginitems">
                    <a href="/signup" style="font-size: 12px; display: flex; justify-content: center;">Don't have an
                        account? Sign up</a>

                </div>
            </div>
        </div>
</body>

</html>
